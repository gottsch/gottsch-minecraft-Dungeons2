# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G

minecraft_version=1.12.2
minecraft_version_range=[1.12.2]
# the forge version the mod is built and tested against
forge_version=14.23.5.2859
mapping_channel=snapshot
mapping_version=20171003

mod_id=dungeons2
mod_name=Dungeons2
mod_version=2.1.0
mod_group_id=gottsch
mod_authors=gottsch
mod_description=Adds large, multi-level procedurally generated dungeons.

# dependencies
gottschcore_version=1.15.1
gottschcore_project_id=272450
gottschcore_file_id=9262990
# optional integration - compiled against the local Treasure2 dev jar (../Treasure-1.12.2/build/libs)
treasure2_version=2.4.0
delaunay_triangulator_version=1.0.3

# paths
dest_folder=E:/Minecraft/mods/1.12.2/
dest_server_folder=F:/Minecraft Server/mods/
