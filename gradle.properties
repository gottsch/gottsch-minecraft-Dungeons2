# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Parchment mappings
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Minecraft / NeoForge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.117
neo_version_range=[21.1.117,)
loader_version_range=[1,)

# gottsch libraries (resolved from mavenLocal)
gottschcore_version=2.10.0
gottschcore_version_range=[2.10.0,3.0.0)
dungeonblocks_version=3.1.0
dungeonblocks_version_range=[3.1.0,4.0.0)
gmm_version=1.1.0
gmm_version_range=[1.1.0,2.0.0)
# Enemy Echelons API, OPTIONAL (compileOnly). Plain version since the NeoForge API's 1.1.0, so ranges
# must be in this form: NeoForge sorts 1.1.0 below the old 1.21.1-1.0.0.
eechelonsapi_version=1.1.0
eechelonsapi_version_range=[1.1.0,2.0.0)

mod_id=dungeons2
mod_name=Dungeons2
mod_license=GNU GPL v3
mod_version=3.0.0
mod_group_id=gottsch.dungeons2
mod_authors=gottsch
mod_description=

# Gottsch Books, nested via jarJar (build.gradle) and required in mods.toml
gottschbooks_version=1.3.0
gottschbooks_version_range=[1.3,2.0)
