# The name of the mod loader type to load - for regular FML @Mod mods it should be javafml
modLoader="javafml" #mandatory

# A version range to match for said mod loader - for regular FML @Mod it will be the forge version
loaderVersion="${loader_version_range}"

# License
license="GNU GPLv3"

# A URL to refer people to when problems occur with this mod
issueTrackerURL="https://github.com/gottsch/gottsch-minecraft-Dungeons2/issues" #optional

# A list of mods - how many allowed here is determined by the individual mod loader
[[mods]] #mandatory

# The modid of the mod
modId="dungeons2" #mandatory

# The version number of the mod - there's a few well known ${} variables useable here or just hardcode it
version="${mod_version}" #mandatory

# A display name for the mod
displayName="Dungeons2" #mandatory

# A URL to query for updates for this mod. See the JSON update specification <here>
updateJSONURL="https://raw.githubusercontent.com/gottsch/gottsch-minecraft-Dungeons2/1.20.1-main/update.json" #optional

# A URL for the "homepage" for this mod, displayed in the mod UI
displayURL="https://www.curseforge.com/minecraft/mc-mods/dungeons2" #optional

# A file name (in the root of the mod JAR) containing a logo for display
#logoFile="dungeons2-curseforge-logo.png" #optional

# A text field displayed in the mod UI
#credits="Authored by gottsch" #optional

# A text field displayed in the mod UI
authors="gottsch" #optional

# The description text for the mod (multi line!) (#mandatory)
description=""

# A dependency - use the . to indicate dependency for a specific modid. Dependencies are optional.
[[dependencies.dungeons2]] #optional
# the modid of the dependency
modId="forge" #mandatory
# Does this dependency have to exist - if not, ordering below must be specified
mandatory=true #mandatory
# The version range of the dependency
versionRange="${forge_version_range}" #mandatory
# An ordering relationship for the dependency - BEFORE or AFTER required if the relationship is not mandatory
ordering="NONE"
# Side this dependency is applied on - BOTH, CLIENT or SERVER
side="BOTH"
# Here's another dependency
[[dependencies.dungeons2]]
modId="minecraft"
mandatory=true
# This version range declares a minimum of the current minecraft version up to but not including the next major version
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
# ORDERING IS "AFTER" FOR ALL THREE LIBRARIES, AND MUST STAY CONSISTENT.
# `ordering` says where THIS mod sits relative to the dependency, so AFTER = "dungeons2 loads after
# gottschcore", which is what building on it implies.
# These were BEFORE until 2026-08-13, which was harmless on its own but became a load-order CYCLE the
# moment gmm was added: gmm's own toml declares gottschcore AFTER, so BEFORE here gave
#     dungeons2 -> gottschcore -> gmm -> dungeons2
# and Forge dies at ModSorter with "Detected Cycles" and a NullPointerException on a null sortedList,
# naming three anonymous ModFileInfo objects and nothing else. Dungeon Denizens uses AFTER for all of
# its libraries; Village Dungeons uses BEFORE for all of its. Either is fine -- MIXING them is not.
[[dependencies.dungeons2]]
modId="gottschcore"
mandatory=true
# This version range declares a minimum of the current minecraft version up to but not including the next major version
versionRange="[2.9.0,3.0.0)"
ordering="AFTER"
side="BOTH"
[[dependencies.dungeons2]]
modId="dungeonblocks"
mandatory=true
versionRange="[3.0.0,4.0.0)"
ordering="AFTER"
side="BOTH"
# gottsch's Monster Manual (gmm) - shared mob base-class/asset library; it registers nothing, this
# mod registers dungeons2:rat / dungeons2:giant_rat from its classes. See the ordering note above.
[[dependencies.dungeons2]]
modId="gmm"
mandatory=true
versionRange="[1.0.1,2.0.0)"
ordering="AFTER"
side="BOTH"

# Treasure2 (treasure2) - OPTIONAL. Backlog #48: a chest marker can opt in to a real Treasure2 chest
# per marker (the boss chest), and everything else falls back to this mod's own chest. mandatory=false
# so the dungeon still generates without it, and AFTER for the same reason as the three above: the
# API is called during worldgen, so Treasure2 must have registered by then. Compiled against
# compileOnly, so every call site is guarded by ModList.get().isLoaded("treasure2").
[[dependencies.dungeons2]]
modId="treasure2"
mandatory=false
versionRange="[4.1.0,5.0.0)"
ordering="AFTER"
side="BOTH"
