#=============================
[[blockProviderConfigs.blockSets]]
	id="default"
	motif="classic"
	pattern="wall_pattern"
	[[blockProviderConfigs.blockSets.elements]]
		id="wall"
		block="minecraft:stone_bricks"
	[[blockProviderConfigs.blockSets.elements]]
		id="corner"
		block="minecraft:polished_andesite"
	[[blockProviderConfigs.blockSets.elements]]
		id="top_corner"
		block="minecraft:polished_andesite"

