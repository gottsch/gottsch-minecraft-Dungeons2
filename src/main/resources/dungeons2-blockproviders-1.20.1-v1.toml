[[blockProviderConfigs]]

# motifs probably wouldn't even be defined in this file
# either it would be defined in the dungeons file or
# there isn't an object for it, it is simply an identifying name
# to categorize and tie dungeons and blockProviders together
# UPDATE a motif is applied to any defined dungeon config, so it
# would need it's own definition/class, but that can be in the
# dungeons config file.
[[blockProviderConfigs.motifs]]
	id="classic"
	biomeWhitelist=["*"]
	biomeBlacklist=[]


