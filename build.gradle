plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'com.gtnewhorizons.retrofuturagradle' version '1.4.9'
    id 'com.gradleup.shadow' version '8.3.5'
}

version = "${minecraft_version}-${mod_version}"
group = mod_group_id
base {
    archivesName = mod_id
}

// Gradle runs on a modern JDK; the mod is compiled and run with Java 8 (auto-provisioned by the foojay resolver)
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
        // Azul covers the most platforms for Java 8 toolchains
        vendor = JvmVendorSpec.AZUL
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

minecraft {
    mcVersion = minecraft_version
    mcpMappingChannel = mapping_channel
    mcpMappingVersion = mapping_version
    username = 'Developer'

    // generates com.someguyssoftware.dungeons2.Tags with the mod version from gradle.properties
    injectedTags.put('VERSION', mod_version)
    injectedTags.put('MOD_ID', mod_id)
    injectedTags.put('MOD_NAME', mod_name)
}

tasks.injectTags.configure {
    outputClassName = 'com.someguyssoftware.dungeons2.Tags'
}

repositories {
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    mavenCentral()
}

// dependencies bundled (and relocated) into the mod jar
configurations {
    shade
    implementation.extendsFrom shade
}

/*
 * RFG's dev environment always runs Forge 14.23.5.2847 (hard-coded in RFG), but GottschCore declares
 * required-after:forge@[14.23.5.2854,) so FML refuses to load it in runClient/runServer.
 * For the dev runtime only, use a copy of the GottschCore jar with that minimum lowered to 2847.
 * Compiling uses the unmodified jar and nothing here affects the released mod jar.
 */
def gottschcoreDevJar = file("build/devDeps/gottschcore-${gottschcore_version}-${gottschcore_file_id}-dev.jar")
if (!gottschcoreDevJar.exists()) {
    def original = configurations.detachedConfiguration(
            dependencies.create("curse.maven:gottschcore-${gottschcore_project_id}:${gottschcore_file_id}")).singleFile
    // same-length replacement, so the class file constant pool stays valid
    byte[] from = 'forge@[14.23.5.2854,)'.getBytes('UTF-8')
    byte[] to = 'forge@[14.23.5.2847,)'.getBytes('UTF-8')
    gottschcoreDevJar.parentFile.mkdirs()
    new java.util.zip.ZipFile(original).withCloseable { zip ->
        new java.util.zip.ZipOutputStream(new FileOutputStream(gottschcoreDevJar)).withCloseable { out ->
            zip.entries().each { entry ->
                byte[] bytes = zip.getInputStream(entry).bytes
                if (entry.name.endsWith('.class')) {
                    for (int i = 0; i <= bytes.length - from.length; i++) {
                        if (Arrays.equals(Arrays.copyOfRange(bytes, i, i + from.length), from)) {
                            System.arraycopy(to, 0, bytes, i, to.length)
                        }
                    }
                }
                out.putNextEntry(new java.util.zip.ZipEntry(entry.name))
                out.write(bytes)
                out.closeEntry()
            }
        }
    }
}

dependencies {
    compileOnly rfg.deobf("curse.maven:gottschcore-${gottschcore_project_id}:${gottschcore_file_id}")
    runtimeOnly rfg.deobf(files(gottschcoreDevJar))
    // optional integration (guarded by Loader.isModLoaded). the dev jar is already in MCP names, so no deobf.
    compileOnly files("../Treasure-1.12.2/build/libs/treasure2-${minecraft_version}-${treasure2_version}-dev.jar")
    shade files("../ModCommonLibs/libs/DelaunayTriangulator-${delaunay_triangulator_version}.jar")
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version: minecraft_version, mod_id: mod_id, mod_name: mod_name,
            mod_version: mod_version, mod_authors: mod_authors, mod_description: mod_description
    ]
    inputs.properties replaceProperties

    filesMatching('mcmod.info') {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// shade the DelaunayTriangulator into the dev jar, then reobfuscate the shaded jar into the release jar
tasks.named('shadowJar').configure {
    configurations = [project.configurations.shade]
    // move everything under "io.github" (the DelaunayTriangulator lib) to "com.someguyssoftware.dungeons2.triangulation"
    relocate 'io.github', 'com.someguyssoftware.dungeons2.triangulation'
    archiveClassifier = 'dev-shaded'
    manifest.inheritFrom tasks.jar.manifest
}

tasks.named('reobfJar').configure {
    inputJar = tasks.named('shadowJar').flatMap { it.archiveFile }
}

// the release jar is the reobfuscated one: dungeons2-<mc version>-<mod version>.jar
tasks.named('jar').configure {
    archiveClassifier = 'dev'
}

eclipse {
    classpath {
        downloadSources = true
    }
}

idea {
    module {
        downloadSources = true
        inheritOutputDirs = true
    }
}
