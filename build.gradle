plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
//    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

version = "${minecraft_version}-${mod_version}"
group = mod_group_id
base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))
minecraft {
    mappings channel: mapping_channel, version: mapping_version
 	
 	 // This property allows configuring Gradle's ProcessResources task(s) to run on IDE output locations before launching the game.
    // It is REQUIRED to be set to true for this template to function.
    // See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
    copyIdeResources = true
    
    runs {
        client {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id
        }
        
        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            // example of overriding the workingDirectory set in configureEach above
            workingDirectory project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // Put repositories for dependencies here
    // ForgeGradle automatically adds the Forge maven and Maven Central for you

    mavenLocal()
    maven {
        url "file:///${project.projectDir}/../maven"
    }
    maven {
        name = "CurseMaven"
        url = "https://www.cursemaven.com"
    }
    maven {
        url = "https://maven.theillusivec4.top/"
    }
    
    // If you have mod jar dependencies in ./libs, you can declare them as a repository like so:
     flatDir {
         dir 'libs'
     }
}

dependencies {
    // Specify the version of Minecraft to use, If this is any group other then 'net.minecraft' it is assumed
    // that the dep is a ForgeGradle 'patcher' dependency. And it's patches will be applied.
    // The userdev artifact is a special name and will get all sorts of transformations applied to it.
    //minecraft "net.minecraftforge:forge:${mc_version}-${forge_version}"
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
	implementation fg.deobf("gottsch:gottschcore:1.20.1-2.9.0")
    implementation fg.deobf("gottsch:dungeonblocks:1.20.1-3.0.0")
    // gottsch's Monster Manual (gmm) - shared mob base-class/asset library. It REGISTERS NOTHING;
    // this mod registers the mobs it wants under its own namespace (see DungeonsEntities).
    implementation fg.deobf("gottsch:monster-manual:[1.20.1-1.0.1,1.20.1-2.0.0)")
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // JUnit 5 for the POJO core / planner tests (no Minecraft needed).
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Minimal SLF4J binding so MazeLevelGenerator2D's logger calls don't print "no provider" warnings during tests.
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.9'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

// Diagnostic: sweeps the minimum gap between rooms and reports what each setting costs
// (rooms per floor, plan failures) and buys (corridor width, rooms not sharing a wall).
// Planning only -- no rendering -- so it runs hundreds of dungeons per setting.
//
//   ./gradlew spacingSweep
//   ./gradlew spacingSweep -Pseeds=200 -Psize=LARGE -Pgaps=0,2,4
tasks.register('spacingSweep', JavaExec) {
    group = 'diagnostic'
    description = 'Measures the room-spacing / corridor-width trade-off across many seeds.'
    dependsOn 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'mod.gottsch.forge.dungeons2.diagnostic.SpacingSweep'
    // The planner logs a WARN per rejected room; at hundreds of dungeons that buries the report.
    systemProperty 'org.slf4j.simpleLogger.defaultLogLevel', 'error'
    ['seeds', 'size', 'gaps', 'corridorWidth'].each { k ->
        if (project.hasProperty(k)) {
            args "--$k=${project.property(k)}"
        }
    }
}

// Diagnostic: plans a dungeon headlessly and writes a standalone interactive 2D floor-plan
// viewer (one HTML file, no server, no game). Runs on the test runtime classpath because that
// is where Minecraft and the diagnostic sources both live.
//
//   ./gradlew floorplan
//   ./gradlew floorplan -Pseed=12345 -Psize=MEDIUM -Pfloors=2 -Popen=true
//
// See FloorPlanTool for the full option list.
tasks.register('floorplan', JavaExec) {
    group = 'diagnostic'
    description = 'Writes an interactive 2D dungeon floor-plan viewer to build/floorplan/.'
    dependsOn 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'mod.gottsch.forge.dungeons2.diagnostic.FloorPlanTool'
    systemProperty 'org.slf4j.simpleLogger.defaultLogLevel', 'error'
    ['seed', 'size', 'motif', 'floors', 'corridorWidth', 'corridorHeight', 'narrowHeight', 'profile', 'archBlock',
     'minRoomGap', 'x', 'z', 'surfaceY', 'order', 'out', 'open', 'describe'].each { k ->
        if (project.hasProperty(k)) {
            args "--$k=${project.property(k)}"
        }
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    // This is the preferred method to reobfuscate your jar file
     finalizedBy 'reobfJar'
}

// However if you are in a multi-project build, dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing
// publish.dependsOn('reobfJar')

// run "gradlew build publish" to build jars and generate a maven repo for them
// run "gradlew build" to build the jars without mavening them
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            name="localMaven"
            url "file:///${project.projectDir}/../maven"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

