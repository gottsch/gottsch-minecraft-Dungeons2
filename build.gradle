plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.78'
    id 'idea'
    id 'eclipse'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = "${minecraft_version}-${mod_version}"
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenLocal()
    maven {
        name = "CurseMaven"
        url = "https://www.cursemaven.com"
    }
}

// TODO port: the Treasure2 integration is not ported yet; its class is excluded from compilation
// until a neo build of that API exists. See PORT-NOTES.md. (Enemy Echelons was restored with API 1.1.0.)
// Excluded by absolute file, not by pattern: a pattern would also drop the same-named stub.
def portExcluded = [
        'src/main/java/mod/gottsch/neo/dungeons2/core/integration/TreasureIntegration.java',
].collect { file(it) }
sourceSets.main.java {
    exclude { element -> portExcluded.contains(element.file) }
}
// compile stubs (isLoaded() == false) standing in for the excluded integration facades
sourceSets.main.java.srcDir 'src/main/stubs/java'
sourceSets.test.java {
    exclude 'mod/gottsch/neo/dungeons2/core/integration/TreasureIntegrationTest.java'
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    unitTest {
        enable()
        testedMod = mods.dungeons2
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "gottsch:gottschcore-neoforge-${minecraft_version}:${gottschcore_version}"
    implementation "gottsch:dungeonblocks-neoforge-${minecraft_version}:${dungeonblocks_version}"
    implementation "gottsch:monster-manual-neoforge-${minecraft_version}:${gmm_version}"

    // Gottsch Books, nested in the jar (lore books found in dungeon loot). REQUIRED, not optional,
    // because a loot table that names gottschbooks:book fails to load when the item does not exist.
    implementation "gottsch:gottschbooks-neoforge-${minecraft_version}:${gottschbooks_version}"
    jarJar("gottsch:gottschbooks-neoforge-${minecraft_version}") {
        version {
            strictly gottschbooks_version_range
            prefer gottschbooks_version
        }
    }

    // Enemy Echelons API - OPTIONAL soft dependency: every EE reference lives in EchelonsIntegration's
    // nested Delegate, reached only once ModList says `eechelonsapi` is loaded.
    compileOnly "gottsch:eechelonsapi-neoforge-${minecraft_version}:${eechelonsapi_version}"

    // Jade - OPTIONAL. integration/jade/DungeonsJadePlugin adds an "Echelon: N" line to a mob's
    // tooltip. Only Jade loads that class (by its @WailaPlugin annotation), so compileOnly is enough.
    compileOnly "curse.maven:jade-324717:7545219"

    // DEV ONLY: EE and Jade in runClient, to check that spawner mobs get scaled (Jade shows their
    // echelon, hearts and armor). localRuntime feeds runtimeClasspath only, so the unit tests still
    // see EE absent. Comment both out to check the EE-absent case in game.
    localRuntime "gottsch:eechelonsapi-neoforge-${minecraft_version}:${eechelonsapi_version}"
    localRuntime "curse.maven:jade-324717:7545219"

    // TODO port: Treasure2 (compileOnly) - not ported for this pass. Dev-only runtime mods
    // (Terralith, Stronger Mobs Below) dropped.

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform {
        // Checks that only make sense on FINISHED content. A template is blocked out in
        // minecraft:bedrock while it is being authored and only swapped to structure_void when
        // the room is finalised, so a bedrock assertion would fail continuously during authoring
        // -- and a permanently red build is worse than no build, because a real failure hides in
        // the noise. Run these deliberately instead:
        //
        //   ./gradlew releaseCheck
        //
        // BEFORE PUBLISHING A JAR. Nothing runs it for you.
        excludeTags 'release'
        // The @Tag("probe") classes measure rather than check: how often a slot fires, how big a
        // boss room fits, who owns a wall. Tools for re-measuring after a tuning change, and two
        // thirds of the suite's time, so they run only on purpose:
        //
        //   ./gradlew probes
        excludeTags 'probe'
    }
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

// The @Tag("probe") measurements `test` skips. Each prints its report; run after changing what it
// measures (a slot's counts, the room size tiers, the planner's spacing).
//
//   ./gradlew probes
//   ./gradlew probes --tests '*SpawnerIncidenceProbe'
tasks.register('probes', Test) {
    group = 'verification'
    description = 'Runs the measurement probes excluded from `test`, printing their reports.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'probe'
    }
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
    }
    outputs.upToDateWhen { false }
}

// The @Tag("release") tests `test` skips -- the ones that assert authoring is FINISHED rather
// than that the code is correct. Run before publishing.
//
//   ./gradlew releaseCheck
tasks.register('releaseCheck', Test) {
    group = 'verification'
    description = 'Runs the release-gate checks excluded from `test` (finished-content assertions).'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'release'
    }
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
    // Otherwise an unchanged tree reports UP-TO-DATE and prints nothing, which reads as "passed"
    // for a task whose whole job is to be run at a moment that matters.
    outputs.upToDateWhen { false }
}

// Diagnostic: sweeps the minimum gap between rooms and reports what each setting costs
// (rooms per floor, plan failures) and buys (corridor width, rooms not sharing a wall).
// Planning only -- no rendering -- so it runs hundreds of dungeons per setting.
//
//   ./gradlew spacingSweep
//   ./gradlew spacingSweep -Pseeds=200 -Psize=LARGE -Pgaps=0,2,4
tasks.register('spacingSweep', JavaExec) {
    group = 'diagnostic'
    description = 'Measures the room-spacing / corridor-width trade-off across many seeds.'
    dependsOn 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'mod.gottsch.neo.dungeons2.diagnostic.SpacingSweep'
    // The planner logs a WARN per rejected room; at hundreds of dungeons that buries the report.
    systemProperty 'org.slf4j.simpleLogger.defaultLogLevel', 'error'
    ['seeds', 'size', 'gaps', 'corridorWidth'].each { k ->
        if (project.hasProperty(k)) {
            args "--$k=${project.property(k)}"
        }
    }
}

// Diagnostic: plans a dungeon headlessly and writes a standalone interactive 2D floor-plan
// viewer (one HTML file, no server, no game). Runs on the test runtime classpath because that
// is where Minecraft and the diagnostic sources both live.
//
//   ./gradlew floorplan
//   ./gradlew floorplan -Pseed=12345 -Psize=MEDIUM -Pfloors=2 -Popen=true
//
// See FloorPlanTool for the full option list.
tasks.register('floorplan', JavaExec) {
    group = 'diagnostic'
    description = 'Writes an interactive 2D dungeon floor-plan viewer to build/floorplan/.'
    dependsOn 'testClasses'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'mod.gottsch.neo.dungeons2.diagnostic.FloorPlanTool'
    systemProperty 'org.slf4j.simpleLogger.defaultLogLevel', 'error'
    ['seed', 'size', 'motif', 'floors', 'corridorWidth', 'corridorHeight', 'narrowHeight', 'profile', 'archBlock',
     'minRoomGap', 'x', 'z', 'surfaceY', 'order', 'out', 'open', 'describe'].each { k ->
        if (project.hasProperty(k)) {
            args "--$k=${project.property(k)}"
        }
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version          : minecraft_version,
            minecraft_version_range    : minecraft_version_range,
            neo_version                : neo_version,
            neo_version_range          : neo_version_range,
            loader_version_range       : loader_version_range,
            mod_id                     : mod_id,
            mod_name                   : mod_name,
            mod_license                : mod_license,
            mod_version                : mod_version,
            mod_authors                : mod_authors,
            mod_description            : mod_description,
            gottschcore_version_range  : gottschcore_version_range,
            dungeonblocks_version_range: dungeonblocks_version_range,
            gmm_version_range          : gmm_version_range,
            gottschbooks_version_range : gottschbooks_version_range,
            eechelonsapi_version_range : eechelonsapi_version_range
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '5000'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
